name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Cada día a las 04:00 UTC (06:00 en España en verano, 05:00 en invierno).
    # Corre a diario como red de seguridad: si un día falla, el siguiente se recupera solo.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Refresca article.json con el artículo de la semana desde jw.org.
      # Si jw.org no está disponible, conserva la copia existente (no rompe el despliegue).
      - name: Refresh weekly article
        run: node scripts/fetch-article.mjs

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js article.json manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
